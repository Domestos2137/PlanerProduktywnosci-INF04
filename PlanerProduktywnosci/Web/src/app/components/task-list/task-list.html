<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary">📋 Moje Zadania</h2>
    <button class="btn btn-success">+ Dodaj zadanie</button>
  </div>

  <div class="row">
    <div *ngFor="let task of tasks" class="col-md-4 mb-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">{{ task.title }}</h5>
          <h6 class="card-subtitle mb-2 text-muted">{{ task.category }}</h6>
          <p class="card-text">{{ task.description }}</p>
          <div class="d-flex justify-content-between align-items-center">
            <span class="badge" [ngClass]="{
              'bg-info': task.status === 'Nowe',
              'bg-warning': task.status === 'W trakcie',
              'bg-success': task.status === 'Wykonane'
            }">{{ task.status }}</span>
            <small class="text-danger" *ngIf="task.dueDate">📅 {{ task.dueDate | date }}</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
